[package]
name = "shopping-list"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
regex = "1"
serde_urlencoded = "0.7"
# rustls + bundled Mozilla roots: HTTPS Home Assistant URLs validate with no CA
# certs shipped in the `scratch` runtime image. default-features=false drops the
# native-tls/OpenSSL backend so the binary stays fully static (musl).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
