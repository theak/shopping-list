<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <title>Shopping List</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/static/img/icon.png">
    <link rel="icon" type="image/png" href="/static/img/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Shopping List">
    <meta name="theme-color" content="#1976d2">
    <link rel="manifest" href="{{manifest_href}}">
    <link rel="stylesheet" href="/static/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script defer src="/static/js/script.js"></script>
    <script defer src="/static/js/alpine.min.js"></script>
</head>
<body>
    <main class="container" x-data="list" x-cloak>
        <div class="offline-banner" x-show="offline"
             x-text="lastSync ? `Offline: last synced ${lastSync}` : 'Offline'"></div>

        <div class="card">
            <div class="card-header">
                <h1>Shopping List</h1>
            </div>
            <div class="card-body">
                <form role="group" @submit.prevent="add()">
                    <input type="text" x-model="newItem" placeholder="Add an item"
                           maxlength="100" autocapitalize="off" autocomplete="off" :disabled="offline">
                    <button type="submit" :disabled="offline">Add</button>
                </form>

                <ul class="list">
                    <template x-for="item in incomplete" :key="item.name">
                        <li>
                            <input type="checkbox" :checked="item.complete" :disabled="offline" @change="toggle(item)">
                            <span class="name" x-show="editing !== item.name" @click="startEdit(item)"
                                  x-text="item.name"></span>
                            <span class="edit" x-show="editing === item.name">
                                <input type="text" x-model="editText" maxlength="100"
                                       @keydown.enter="save(item)" @keydown.escape="cancelEdit()">
                                <button @click="save(item)">Save</button>
                                <button class="secondary" @click="cancelEdit()">Cancel</button>
                            </span>
                        </li>
                    </template>
                </ul>

                <p x-show="!incomplete.length" class="empty">🎉 All items completed!</p>

                <template x-if="complete.length">
                    <section>
                        <h2 class="section-title">Completed</h2>
                        <ul class="list">
                            <template x-for="item in complete" :key="item.name">
                                <li>
                                    <input type="checkbox" :checked="item.complete" :disabled="offline" @change="toggle(item)">
                                    <s class="name" x-text="item.name"></s>
                                </li>
                            </template>
                        </ul>
                    </section>
                </template>
            </div>
        </div>
    </main>
</body>
</html>
